apiVersion: apps/v1
kind: Deployment
metadata:
  name: project14-web
  labels:
    app: project14-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: project14-web
  template:
    metadata:
      labels:
        app: project14-web
    spec:
      containers:
        - name: web
          # Image built and pushed in Project 13
          image: 590507089733.dkr.ecr.ap-south-1.amazonaws.com/shivam-project13-ecr:v1
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
